<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Calculator</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, sans-serif;
        }

        body {
            background: #121212;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            width: 1000px;
            background: #141415;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 20px;
            padding: 24px;
        }

        .app-container {
            width: 320px;
        }

        .cards-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: #212121;
            border-radius: 12px;
            padding: 24px;
            min-height: 140px;
        }

        .card1 {
            background: #212121;
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .card-label {
            color: #9e9e9e;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .number-input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-size: 56px;
            font-weight: 700;
            color: white;
        }

        .orange {
            color: #f4511e;
        }

        /* ---------- CHART ---------- */
        .chart-card {
            width: 700px;
            background: #212121;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 20px;
            padding: 24px;
        }

        .chart-title {
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .visual-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }

        .chart-container {
            width: 280px;
            height: 280px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-width: 200px;
        }

        .percentage-box {
            margin-bottom: 25px;
        }

        .percentage-box h1 {
            font-size: 60px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .percentage-box p {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 14px;
        }

        .custom-legend {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e2e8f0;
            font-size: 14px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .attended {
            background: #22c55e;
        }

        .safe {
            background: #f59e0b;
        }

        .needed {
            background: #3b82f6;
        }

        .bunked {
            background: #64748b;
        }

        /* ---------- BUTTON ---------- */
        .btn-reset {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #ccc;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.20);
            color: #fff;
        }

        .btn-reset i {
            font-size: 13px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media(max-width:900px) {
            .main-layout {
                flex-direction: column;
            }

            .chart-card {
                width: 100%;
            }
        }

        /* remove arrows from number inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body>

    <div class="main-layout">
        <!-- LEFT: Input Cards -->
        <div class="app-container">
            <div class="cards-stack">
                <div class="card">
                    <div class="card-label">Overall Hours</div>
                    <input id="overallInput" class="number-input orange" type="number" value="0" min="0" />
                </div>
                <div class="card">
                    <div class="card-label">Attended Hours</div>
                    <input id="attendedInput" class="number-input" type="number" value="0" min="0" />
                </div>
            </div>
            <br />
            <div align="right">
                <button class="btn-reset" onclick="resetQuickCalc()">
                    <i class="fas fa-undo"></i> Reset
                </button>
            </div>
        </div>

        <!-- RIGHT: Chart -->
        <div class="chart-card">
            <div class="chart-title">VISUALIZATION</div>

            <div class="visual-wrapper">

                <div class="chart-container">
                    <canvas id="attendanceChart"></canvas>
                </div>

                <div class="right-panel">
                    <div class="percentage-box">
                        <h1 id="percentage">0%</h1>
                        <p id="statusText">Loading…</p>
                    </div>

                    <div class="custom-legend">
                        <div class="legend-item">
                            <span class="dot attended"></span>
                            <span>Attended</span>
                        </div>
                        <div class="legend-item">
                            <span class="dot safe"></span>
                            <span>Safe Bunks</span>
                        </div>
                        <div class="legend-item">
                            <span class="dot needed"></span>
                            <span>Needed</span>
                        </div>
                        <div class="legend-item">
                            <span class="dot bunked"></span>
                            <span>Bunked</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // -------- CHART SETUP --------
        const ctx = document.getElementById("attendanceChart");
        const chart = new Chart(ctx, {
            type: "doughnut",
            data: {
                labels: ["Attended", "Safe Bunks", "Needed", "Bunked"],
                datasets: [{
                    data: [1, 1, 1, 1],
                    backgroundColor: ["#22c55e", "#f59e0b", "#3b82f6", "#64748b"],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                cutout: 0,
                plugins: {
                    legend: { display: false }
                }
            }
        });

        // -------- HELPERS --------
        function clampInput(el) {
            let val = parseInt(el.value);
            if (isNaN(val) || val < 0) el.value = 0;
        }

        // -------- UPDATE CHART (FIXED TOTAL LOGIC) --------
        function updateChart() {
            let total = parseInt(document.getElementById("overallInput").value) || 0;
            let attended = parseInt(document.getElementById("attendedInput").value) || 0;

            // Enforce non‑negative
            total = Math.max(0, total);
            attended = Math.max(0, attended);

            // Attended cannot exceed total
            if (attended > total) {
                attended = total;
                document.getElementById("attendedInput").value = total;
            }

            // Avoid division by zero
            if (total === 0) total = 1;

            const target = 0.75; // 75%
            const requiredAttended = Math.ceil(target * total);

            // Needed = how many more you MUST attend (if below target)
            const needed = Math.max(0, requiredAttended - attended);

            // Safe Bunks = how many remaining you CAN skip (if above target)
            const remaining = total - attended;
            const safeBunks = Math.min(remaining, Math.max(0, attended - requiredAttended));

            // Bunked (total not attended yet – remaining)
            const bunked = remaining;

            // Percentage
            const percentage = (attended / total) * 100;
            document.getElementById("percentage").textContent = percentage.toFixed(1) + "%";

            // Status message
            if (percentage >= target * 100) {
                document.getElementById("statusText").textContent = safeBunks + " Safe Bunks Available";
            } else {
                document.getElementById("statusText").textContent = needed + " Classes Needed";
            }

            // Update doughnut data
            chart.data.datasets[0].data = [attended, safeBunks, needed, bunked];
            chart.update();
        }

        // -------- RESET --------
        function resetQuickCalc() {
            document.getElementById("overallInput").value = 0;
            document.getElementById("attendedInput").value = 0;
            updateChart();
        }

        // -------- INPUT EVENTS --------
        const overallEl = document.getElementById("overallInput");
        const attendedEl = document.getElementById("attendedInput");

        function onInput() {
            clampInput(overallEl);
            clampInput(attendedEl);
            updateChart();
        }

        overallEl.addEventListener("input", onInput);
        attendedEl.addEventListener("input", onInput);

        // Also clamp on blur (catches negative signs)
        overallEl.addEventListener("blur", function () {
            clampInput(this);
            updateChart();
        });
        attendedEl.addEventListener("blur", function () {
            clampInput(this);
            updateChart();
        });

        // Initial render
        updateChart();
    </script>

</body>

</html>
